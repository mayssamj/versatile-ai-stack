# SPDX-FileCopyrightText: ai-stack installer Phase 04
# OpenShell sandbox policy for hermes-fleet-v1.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    # Must be a SUPERSET of the base image's live read_only mounts. OpenShell's
    # `policy set` rejects REMOVING a read_only mount from a live sandbox
    # ("path '/proc' cannot be removed on a live sandbox"). The base mounts
    # /proc read_only, so list /proc (not /proc/self) or the apply fails.
    # CHANGELOG 2026-05-30.
    - /usr
    - /lib
    - /etc
    - /app
    - /var/log
    - /proc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # LiteLLM proxy — Hermes routes /v1/chat/completions here with its virtual
  # key (HERMES_LITELLM_KEY; server-side model allowlist). Direct virtual-key
  # dial is the working pattern; OpenShell's inference.local L7 rewrite forwards
  # the shipped `openai` provider to api.openai.com (CHANGELOG 2026-05-30).
  litellm_proxy:
    name: litellm-proxy
    endpoints:
      - host: host.docker.internal
        port: 4000
    binaries:
      - { path: "/**" }

  # Telegram — hermes-agent's native Telegram gateway long-polls api.telegram.org
  # (getUpdates). Required for Phase 20 (vz_hermes_controller_bot). Egress only.
  telegram:
    name: telegram
    endpoints:
      - { host: api.telegram.org, port: 443 }
    binaries:
      - { path: "/**" }

  # Slack — hermes-agent's native Slack channel (Phase 38) uses SOCKET MODE: an
  # OUTBOUND WebSocket, so no inbound webhook/public URL. The gateway calls the
  # Web API (apps.connections.open on slack.com) for a WSS ticket, then holds a
  # WebSocket to wss-*.slack.com. Egress only; harmless when Slack isn't
  # configured (nothing dials these). Like the sourcegraph_mcp stanza this lives
  # HERE (the heredoc) as the SINGLE SOURCE OF TRUTH — the committed YAML is a
  # generated mirror. If Socket Mode fails to connect, tail
  # /sandbox/.hermes-gateway.log for 'policy_denied' + the denied host and add it.
  slack:
    name: slack
    endpoints:
      - { host: slack.com, port: 443 }
      - { host: api.slack.com, port: 443 }
      - { host: wss-primary.slack.com, port: 443 }
      - { host: wss-backup.slack.com, port: 443 }
      - { host: wss.slack.com, port: 443 }
      - { host: files.slack.com, port: 443 }
    binaries:
      - { path: "/**" }

  # Honcho memory via the host-side honcho-mcp SHIM (host.docker.internal:7082, Phase 40).
  # The RAW Honcho REST API (:8000, AUTH_USE_AUTH=false) is intentionally NOT reachable from
  # the sandbox — the token-gated MCP shim is the only memory path. (Generated from the
  # 04_openshell.sh heredoc — edit there; this is a mirror.)
  honcho_mcp:
    name: honcho-mcp
    endpoints:
      - host: host.docker.internal
        port: 7082
    binaries:
      - { path: "/**" }

  # FalkorDB graph memory via the host-side falkordb-mcp shim (host.docker.internal:7083,
  # Phase 41). Raw falkordb:6379 stays DENIED — the token-gated shim is the only path.
  # (Generated from the 04_openshell.sh heredoc — edit there; this is a mirror.)
  falkordb_mcp:
    name: falkordb-mcp
    endpoints:
      - host: host.docker.internal
        port: 7083
    binaries:
      - { path: "/**" }

  # docs MCP server — also host-bound on 0.0.0.0:8765 (see Phase 06).
  docs_mcp:
    name: docs-mcp
    endpoints:
      - host: host.docker.internal
        port: 8765
    binaries:
      - { path: "/**" }

  # Sourcegraph MCP — local self-hosted Sourcegraph code-search MCP server
  # (opt-in Phase 27). Hermes profiles reach it at host.docker.internal:7080
  # (= the Mac's 127.0.0.1:7080, where start-sourcegraph.sh publishes). Without
  # this stanza the deny-by-default landlock returns 403 ("policy_denied") to the
  # MCP POST. Egress only; harmless when SG isn't installed (nothing dials 7080).
  # This stanza lives HERE (the heredoc) as the SINGLE SOURCE OF TRUTH — the
  # `cat > "$POLICY"` above regenerates openshell/policies/hermes-fleet-v1.yaml
  # from it on every Phase 04 run, so the committed YAML is a generated mirror,
  # NOT a second hand-edited copy. (§24 council 2026-06-20: the intermittent live
  # policy revert was a stanza-less re-apply of this generated file; keeping the
  # stanza in the generator is what makes SG reachability durable across
  # install/recreate. Phase 27 also live-applies it as an immediate backstop.)
  sourcegraph_mcp:
    name: sourcegraph-mcp
    endpoints:
      - host: host.docker.internal
        port: 7080
    binaries:
      - { path: "/**" }

  # Egress for common dev tools (pip, npm, gh, git clone).
  package_registries:
    name: package-registries
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: registry.npmjs.org, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: github.com, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
      - { host: codeload.github.com, port: 443 }
    binaries:
      - { path: "/**" }
