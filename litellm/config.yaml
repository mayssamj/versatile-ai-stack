      # SPECIAL endpoints (image/realtime/computer-use) — LiteLLM
      # may not support all of these via /chat/completions surface.
      # Test against the LiteLLM docs for each before enabling.
      # - model_name: openai-computer-use
      #   litellm_params:
      #     model: openai/computer-use-preview-2025-03-11
