      # - model_name: openai-gpt-image-2
      #   litellm_params:
      #     model: openai/gpt-image-2
      #     api_key: os.environ/OPENAI_API_KEY
      # - model_name: openai-gpt-realtime
      #   litellm_params:
      #     model: openai/gpt-realtime
      #     api_key: os.environ/OPENAI_API_KEY
  # ============================================================
  # CLAUDE CODE — your Claude Pro/Max SUBSCRIPTION (no API key).
  # Routed through Meridian, a host daemon that reuses your
  # `claude login` OAuth (auto-refreshed) and exposes an
  # OpenAI-compatible surface. Same host.docker.internal pattern
  # as LM Studio above — Meridian listens on 127.0.0.1:3456 and
  # OrbStack forwards host loopback into containers.
  #   Meridian default = INTERNAL mode: the Claude Code agent loop
  #   (tools, edits) runs on the host and returns the final result.
  # `api_key` is a dummy — Meridian holds the real OAuth, not LiteLLM.
  # The `-sub` suffix = SUBSCRIPTION (your Claude plan, no API key). NOTE:
  # Meridian's /v1/models catalog is static (lists ≤4.7) but it PASSES THROUGH
  # any model id to its bundled claude-code (2.1.160), so claude-opus-4-8 works.
  # (The wire model id keeps hyphens — `claude-opus-4-8` — because that's what
  # Anthropic expects; the dotted model_name is just the alias shown in Open WebUI.)
  #
  # EFFORT: Opus 4.8 reasoning depth is controlled by `output_config.effort`
  # (low/medium/high/xhigh/max), NOT a token budget (budget_tokens is rejected
  # on 4.7+). Meridian reads `body.effort` (or the `x-opencode-effort` header)
  # and forwards it into the Claude Code Agent SDK `query({effort})` — confirmed
  # by reading Meridian 1.42.1's dist. We inject `effort` via per-model
  # `extra_body` (LiteLLM merges it into the request body; not subject to
  # `drop_params`, which only strips recognized-but-unsupported OpenAI params).
  # FULL EFFORT LADDER, one model per level so you pick effort by picking the
  # model in Open WebUI (per-chat effort can't be sent from OWUI). `-high` ==
  # the model default (effort:high ≡ omitting it). NOTE: on Sonnet 4.6 `xhigh`
  # falls back to `high` (xhigh is Opus-4.7/4.8 only), so Sonnet omits it; `max`
  # is honored on both. Reasoning TEXT is not surfaced (internal mode hides it).
  # ============================================================
  # --- Opus 4.8 (subscription) — low/medium/high/xhigh/max ---
  #- model_name: claude-opus-4.8-sub-low
  #  litellm_params:
  #    model: openai/claude-opus-4-8
  #    api_base: http://host.docker.internal:3456/v1
  #    api_key: meridian
  #    extra_body:
  #      effort: low
  #- model_name: claude-opus-4.8-sub-medium
  #  litellm_params:
  #    model: openai/claude-opus-4-8
  #    api_base: http://host.docker.internal:3456/v1
  #    api_key: meridian
  #    extra_body:
  #      effort: medium
  - model_name: claude-opus-sub-high
    #  - model_name: local-gemma4
    #    litellm_params:
    #      model: ollama_chat/gemma4:e4b
    #      api_base: http://ollama:11434
    #  - model_name: local-qwen3.6
    #    litellm_params:
    #      model: openai/qwen/qwen3.6-27b
    #      api_base: http://host.docker.internal:1234/v1
    #      api_key: lm-studio
    #  - model_name: local-qwen3-coder
    #    litellm_params:
    #      model: openai/qwen3-coder-30b-a3b-instruct-mlx
    #      api_base: http://host.docker.internal:1234/v1
    #      api_key: lm-studio

    litellm_params:
      model: openai/claude-opus-4-8
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: high
  - model_name: claude-opus-sub-xhigh
    litellm_params:
      model: openai/claude-opus-4-8
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: xhigh
  - model_name: claude-opus-sub-max
    litellm_params:
      model: openai/claude-opus-4-8
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: max
  - model_name: claude-opus-sub-ultracode
    litellm_params:
      model: openai/claude-opus-4-8
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: ultracode
  # --- Sonnet 4.6 (subscription) — high / max / ultracode (no xhigh: ≡ high) ---
  - model_name: claude-sonnet-sub-high
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: high
  - model_name: claude-sonnet-sub-max
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: max
  - model_name: claude-sonnet-sub-ultracode
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://host.docker.internal:3456/v1
      api_key: meridian
      extra_body:
        effort: ultracode
  #- model_name: local-gemma4-mlx
  #  litellm_params:
  #    model: ollama_chat/gemma4:e4b-mlx
  #    api_base: http://ollama:11434
  - model_name: local-nemotron3-nano-4b
    litellm_params:
      model: ollama_chat/nemotron-3-nano:4b
      api_base: http://ollama:11434
  - model_name: local-nemotron3-nano-4b-mlx
    litellm_params:
      model: openai/nvidia/nemotron-3-nano-4b
      api_base: http://host.docker.internal:1234/v1
      api_key: lm-studio
  - model_name: local-gemma4-12b
    litellm_params:
      model: openai/gemma-4-12b-it
      api_base: http://host.docker.internal:1234/v1
      api_key: lm-studio
  - model_name: local-nemotron3-heavy
    litellm_params:
      model: openai/nvidia-nemotron-3-nano-30b-a3b-mlx
      api_base: http://host.docker.internal:1234/v1
      api_key: lm-studio
  - model_name: local-qwen-heavy-fast
    litellm_params:
      model: openai/qwen3.6-27b-mtplx-optimized-speed
      api_base: http://host.docker.internal:1234/v1
      api_key: lm-studio
litellm_settings:
  # Custom callback writes each call to /traces/litellm.jsonl
  # (mounted to ~/ai-stack/traces on host).
  #  callbacks: ["trace_to_file.handler", "guardrails.handler", "arize_phoenix"]
  callbacks: ["trace_to_file.handler", "arize_phoenix", "guardrails.handler"]
  drop_params: true
  set_verbose: false
  json_logs: true
  # Fallback chains — SAME MODEL via DIFFERENT PROVIDER first,
  # cross-model as last resort. This way prompts tuned for Opus
  # keep getting Opus (just via OpenRouter) when Anthropic's API
  # is down, instead of silently swapping to GPT.
  fallbacks:
    # PLATFORM MODEL POLICY (2026-06-23): claude-opus-sub-max is the DEFAULT
    # model across the whole platform (Hermes fleet, Honcho, MemPalace, DeerFlow,
    # Open WebUI, unassigned agents). local-qwen3 (Qwen3 8B on Ollama) is the
    # OFFLINE FALLBACK for when the Claude subscription via the Meridian daemon is
    # unavailable. LiteLLM is the SINGLE owner of Meridian failover: EVERY
    # meridian-routed `*-sub-*` model fails over to local-qwen3 here, so a default
    # call degrades to local compute instead of a bare 503 — and per-phase
    # availability-gating only needs to handle the lmstudio case. CAVEATS: if BOTH
    # Meridian AND Ollama are down the caller still gets a LiteLLM 503 (no fallback
    # left); local-qwen3 is lower-capability — watch traces/litellm.jsonl if
    # answer quality drops during a Meridian outage.
    # Codex bridge (ChatGPT subscription). Fail over to local-gemma4 ONLY —
    # never to the metered openai-gpt-5.* (no surprise card billing). If both
    # the bridge AND Ollama are down the caller gets a 503 (same as Meridian).
    # Sakana Fugu (metered) — fail over to local, never a silent bill.
      # Cross-model cloud chains (commented, for reference). The openrouter-* /
      # openai-gpt* targets need provider API keys, so those hops dangle until a
      # key is set. local / local-heavy / claude-opus-4.7 are no longer in the
      # model_list (removed in the version-less rename), so no fallback for them.
      #- claude-opus-4.7: ["openrouter-claude-opus-4.7", "openrouter-claude-opus-4.7-fast", "openai-gpt-5.5-pro"]
      #- claude-sonnet-4.6: ["openrouter-claude-sonnet-4.6", "openai-gpt-5.5"]
      #- openai-gpt-5.5-pro: ["openrouter-gpt-5.5-pro", "claude-opus-4.7"]
      #- openai-gpt-5.5: ["openrouter-gpt-5.5", "claude-sonnet-4.6"]
      # Phase 01·H adds the arize_phoenix callback to the list above:
      # callbacks: ["trace_to_file.handler", "guardrails.handler", "arize_phoenix"]
# Guardrails — populated by Phase 01·G. Leave empty here.
guardrails: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
