model_list:
  # ============================================================
  # LOCAL — via Ollama. Three tiers:
  #   local       (default) → Gemma 4 E4B, 9.6GB. Fast, fits comfortably.
  #   local-heavy           → Qwen 3.6 27B, 17GB. Frontier-class but RAM-tight.
  #   local-lfm2            → Liquid LFM2.5-8B-A1B Q4_K_M, 5.16GB. MoE
  #                            (8.3B total / 1.5B active) — long-context
  #                            (131K) and very fast on Apple Silicon.
  # Fleet profiles point at `local` by default — swap individual
  # profiles to `local-heavy` or `local-lfm2` when you need either
  # 27B reasoning or long-context fast inference.
  # ============================================================
  - model_name: local-gemma4
    litellm_params:
      model: ollama_chat/gemma4:e4b-mlx
      api_base: http://ollama:11434
  - model_name: local-qwen3
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434
  # ============================================================
  # CLOUD CHAT — OpenAI (direct API)
  # ============================================================
  - model_name: openai-gpt
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: xhigh
  - model_name: openai-gpt-pro
    litellm_params:
      model: openai/gpt-5.5-pro
      api_key: os.environ/OPENAI_API_KEY
  # ============================================================
  # CLOUD CHAT — OpenAI on your ChatGPT SUBSCRIPTION (no metered key).
  # OPT-IN + ToS-GRAY. Routed through the codex-bridge host daemon
  # (bin/start-codex-bridge.sh → openai-oauth proxy → Codex backend →
  # your ChatGPT plan). Same host.docker.internal pattern as Meridian;
  # `api_key` is a DUMMY (the bridge holds the OAuth, not LiteLLM). The
  # `-sub` suffix = SUBSCRIPTION (your ChatGPT plan, NOT OPENAI_API_KEY).
  # These answer ONLY when the bridge is up (`npx @openai/codex login` +
  # `bin/start-codex-bridge.sh install`); otherwise they fail over to
  # local-gemma4 (NOT to the metered key — never silently bills your card).
  # Rate-limited by your ChatGPT plan (Plus ≈ 15–80 GPT-5.5 msgs / 5h); the
  # rpm/tpm below are a soft burst-guard (for a hard cap add router_settings:
  # optional_pre_call_checks: [enforce_model_rate_limits]). NOTE: the served
  # model id (gpt-5.5/gpt-5.4) is passed through to the Codex backend — verify
  # it answers at activation; adjust `model:` or the bridge `--models` if not.
  # ============================================================
  - model_name: openai-gpt-sub
    litellm_params:
      model: openai/gpt-5.5
      api_base: http://host.docker.internal:3457/v1
      api_key: codex-bridge
      rpm: 6
      tpm: 60000
      reasoning_effort: xhigh
  - model_name: openai-gpt-pro-sub
    litellm_params:
      model: openai/gpt-5.5-pro
      api_base: http://host.docker.internal:3457/v1
      api_key: codex-bridge
      rpm: 6
      tpm: 60000
      reasoning_effort: xhigh
  # ============================================================
  # CLOUD CHAT — OpenRouter (Anthropic models routed via OR)
  # Note: OpenRouter slugs use DOTS not hyphens.
  # `-fast` variants verified: 2.5x faster output, same quality.
  # ============================================================
  - model_name: openrouter-claude-opus
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8
      api_key: os.environ/OPENROUTER_API_KEY
      # cost = 5/25 $ , 1 M ctx, speed = 50 tps
  - model_name: openrouter-claude-opus-fast
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.8-fast
      api_key: os.environ/OPENROUTER_API_KEY
      # cost = 10/50 $ , 1 M ctx, speed = 65 tps
  # ============================================================
  # CLOUD CHAT — OpenRouter (OpenAI models routed via OR)
  # ============================================================
  - model_name: openrouter-gpt
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-gpt-pro
    litellm_params:
      model: openrouter/openai/gpt-5.5-pro
      api_key: os.environ/OPENROUTER_API_KEY
      # cost: 30/180 $ 1M ctx, speed: 16 tps
  # ============================================================
  # CLOUD CHAT — OpenRouter (other providers)
  # DeepSeek V4 and Kimi K2.6 confirmed real (April 2026 releases).
  # ============================================================
  - model_name: openrouter-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      # cost: .5/.9 $ , 40-60 tps
  - model_name: openrouter-deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      # cost: .02/.30 $ , 10-60 tps
  - model_name: openrouter-kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY
      # cost: .68 / 3.41 $ ctx 256k , tps 20 - 100 tps
  - model_name: openrouter-kimi-code
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.7-code
      api_key: os.environ/OPENROUTER_API_KEY
      # cost: .68 / 3.41 $ ctx 256k , tps 20 - 100 tps
  - model_name: openrouter-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      # $0.98 / $3.08per 1M, 25-100 tps
  - model_name: openrouter-glm-vision
    litellm_params:
      model: openrouter/z-ai/glm-5v-turbo
      api_key: os.environ/OPENROUTER_API_KEY
  # ============================================================
  # CLOUD CHAT — Google (direct Gemini API)
  # Gemini 3.1 Pro is the verified flagship (Dec 2025).
  # ============================================================
  - model_name: google-gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: google-gemini-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
  # ============================================================
  # CLOUD CHAT — Sakana Fugu: a multi-agent orchestrator "delivered as one
  # model" (https://sakana.ai/fugu/). OpenAI-compatible API at
  # https://api.sakana.ai/v1 — same custom-endpoint pattern as the codex-bridge
  # / LM Studio routes (model: openai/<id> + api_base + api_key). METERED
  # (subscription $20–200/mo OR pay-as-you-go on Ultra); needs SAKANA_API_KEY in
  # .env (generate at console.sakana.ai). Like the metered openai-* routes it
  # fails over to local-qwen3 — never a silent bill. `fugu` = balanced latency;
  # `fugu-ultra` = max accuracy (coordinates more agents, slower, ~1M ctx).
  # ============================================================
  - model_name: sakana-fugu
    litellm_params:
      model: openai/fugu
      api_base: https://api.sakana.ai/v1
      api_key: os.environ/SAKANA_API_KEY
      rpm: 10
  - model_name: sakana-fugu-ultra
    litellm_params:
      model: openai/fugu-ultra
      api_base: https://api.sakana.ai/v1
      api_key: os.environ/SAKANA_API_KEY
      rpm: 6
  # ============================================================
  # EMBEDDINGS — explicitly tagged with model_info.mode so LiteLLM
  # routes them to /v1/embeddings, not /v1/chat/completions.
  # Honcho, Qdrant ingestion, docs MCP server use these.
  # ============================================================
  - model_name: embed-openai-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
  - model_name: embed-openai-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
  - model_name: embed-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
    model_info:
      mode: embedding
      # ============================================================
      # ╔══════════════════════════════════════════════════════════╗
      # ║  ⚠  UNVERIFIED — DO NOT BULK-UNCOMMENT                  ║
      # ║                                                          ║
      # ║  Each entry below was in the original list but couldn't  ║
      # ║  be confirmed against live provider docs. Verify ONE AT  ║
      # ║  A TIME against openrouter.ai/models or the provider's   ║
      # ║  model docs, then uncomment that single entry.           ║
      # ╚══════════════════════════════════════════════════════════╝
      # - model_name: openrouter-gpt-5.4-pro
      #   litellm_params:
      #     model: openrouter/openai/gpt-5.4-pro
      #     api_key: os.environ/OPENROUTER_API_KEY
      #
      # - model_name: openrouter-deepseek-v4-flash
      #   litellm_params:
      #     model: openrouter/deepseek/deepseek-v4-flash
      #     api_key: os.environ/OPENROUTER_API_KEY
      #
      # - model_name: openrouter-qwen-3.7-max
      #   litellm_params:
      #     model: openrouter/qwen/qwen3.7-max
      #     api_key: os.environ/OPENROUTER_API_KEY
      #
      # - model_name: openrouter-tencent-hy3
      #   litellm_params:
      #     model: openrouter/tencent/hy3-preview
      #     api_key: os.environ/OPENROUTER_API_KEY
      #
      # - model_name: openrouter-gemma-4-31b-it
      #   litellm_params:
      #     model: openrouter/google/gemma-4-31b-it:free
      #     api_key: os.environ/OPENROUTER_API_KEY
      #
      # - model_name: google-gemini-3.5-flash
      #   litellm_params:
      #     model: gemini/gemini-3.5-flash
      #     api_key: os.environ/GOOGLE_API_KEY
      #
      # SPECIAL endpoints (image/realtime/computer-use) — LiteLLM
      # may not support all of these via /chat/completions surface.
      # Test against the LiteLLM docs for each before enabling.
      # - model_name: openai-computer-use
      #   litellm_params:
      #     model: openai/computer-use-preview-2025-03-11
