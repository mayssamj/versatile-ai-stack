litellm_settings:
  # Custom callback writes each call to /traces/litellm.jsonl
  # (mounted to ~/ai-stack/traces on host).
#  callbacks: ["trace_to_file.handler", "guardrails.handler", "arize_phoenix"]
  callbacks: ["trace_to_file.handler", "arize_phoenix"]
  drop_params: true
  set_verbose: false
  json_logs: true
  # Fallback chains — SAME MODEL via DIFFERENT PROVIDER first,
  # cross-model as last resort. This way prompts tuned for Opus
  # keep getting Opus (just via OpenRouter) when Anthropic's API
  # is down, instead of silently swapping to GPT.
  fallbacks:
    - claude-opus: ["openrouter-claude-opus-4.7", "openrouter-claude-opus-4.7-fast", "openai-gpt-5.5-pro"]
    - claude-sonnet: ["openrouter-claude-sonnet-4.6", "openai-gpt-5.5"]
    - openai-gpt-5.5-pro: ["openrouter-gpt-5.5-pro", "claude-opus"]
    - openai-gpt-5.5: ["openrouter-gpt-5.5", "claude-sonnet"]
    # No local fallback — if the local model is down, surface the failure
    # so the user sees that the local stack is unhealthy.
    # NOTE (2026-06-19): the LIVE litellm/config.yaml DIVERGES from this seed — it
    # adds a `local -> claude-opus-sub-xhigh` fallback. That subscription
    # model is intentionally NOT added to this seed (it predates the `-sub` models,
    # so referencing it here would dangle). This seed only applies on a fresh
    # install when litellm/config.yaml is absent.
  # Phase 01·H adds the arize_phoenix callback to the list above:
  # callbacks: ["trace_to_file.handler", "guardrails.handler", "arize_phoenix"]

# Guardrails — populated by Phase 01·G. Leave empty here.
guardrails: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY