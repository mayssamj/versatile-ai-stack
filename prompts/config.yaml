model_list:
  # ============================================================
  # LOCAL — via Ollama. Single model: nemotron-3-nano:4b (~2.8GB, very light).
  #   local        (default) → nemotron-3-nano:4b
  #   local-heavy            → nemotron-3-nano:4b (back-compat alias; no separate
  #                            heavy local model — operator directive 2026-07-01)
  # ============================================================
  - model_name: local
    litellm_params:
      model: ollama_chat/nemotron-3-nano:4b
      api_base: http://ollama:11434
  - model_name: local-heavy
    litellm_params:
      model: ollama_chat/nemotron-3-nano:4b
      api_base: http://ollama:11434

  # ============================================================
  # CLOUD CHAT — Anthropic (direct API)
  # Sonnet 4.7 does not exist — latest Sonnet is 4.6. Next is 4.8 (May 2026).
  # ============================================================
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  # ============================================================
  # CLOUD CHAT — OpenAI (direct API)
  # ============================================================
  - model_name: openai-gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai-gpt-5.5-pro
    litellm_params:
      model: openai/gpt-5.5-pro
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai-gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai-gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: openai-gpt-5.3-codex
    litellm_params:
      model: openai/gpt-5.3-codex
      api_key: os.environ/OPENAI_API_KEY

  # ============================================================
  # CLOUD CHAT — OpenRouter (Anthropic models routed via OR)
  # Note: OpenRouter slugs use DOTS not hyphens.
  # `-fast` variants verified: 2.5x faster output, same quality.
  # ============================================================
  - model_name: openrouter-claude-opus-4.7
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.7
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-claude-opus-4.7-fast
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.7-fast
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-claude-opus-4.6-fast
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.6-fast
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-claude-sonnet-4.6
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY

  # ============================================================
  # CLOUD CHAT — OpenRouter (OpenAI models routed via OR)
  # ============================================================
  - model_name: openrouter-gpt-5.5
    litellm_params:
      model: openrouter/openai/gpt-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-gpt-5.5-pro
    litellm_params:
      model: openrouter/openai/gpt-5.5-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-gpt-5.4
    litellm_params:
      model: openrouter/openai/gpt-5.4
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-gpt-5.3-codex
    litellm_params:
      model: openrouter/openai/gpt-5.3-codex
      api_key: os.environ/OPENROUTER_API_KEY

  # ============================================================
  # CLOUD CHAT — OpenRouter (other providers)
  # DeepSeek V4 and Kimi K2.6 confirmed real (April 2026 releases).
  # ============================================================
  - model_name: openrouter-deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter-kimi-2.6
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY

  # ============================================================
  # CLOUD CHAT — Google (direct Gemini API)
  # Gemini 3.1 Pro is the verified flagship (Dec 2025).
  # ============================================================
  - model_name: google-gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GOOGLE_API_KEY

  # ============================================================
  # EMBEDDINGS — explicitly tagged with model_info.mode so LiteLLM
  # routes them to /v1/embeddings, not /v1/chat/completions.
  # Honcho, Qdrant ingestion, docs MCP server use these.
  # ============================================================
  - model_name: embed-openai-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
  # Canonical-768 cloud route: text-embedding-3-small truncated to 768 via OpenAI
  # `dimensions` (Matryoshka). Schema-compatible drop-in for local embed-nomic(768).
  - model_name: embed-openai-small-768
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      dimensions: 768
    model_info:
      mode: embedding
  - model_name: embed-openai-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
  - model_name: embed-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
    model_info:
      mode: embedding

  # ============================================================
  # ╔══════════════════════════════════════════════════════════╗
  # ║  ⚠  UNVERIFIED — DO NOT BULK-UNCOMMENT                  ║
  # ║                                                          ║
  # ║  Each entry below was in the original list but couldn't  ║
  # ║  be confirmed against live provider docs. Verify ONE AT  ║
  # ║  A TIME against openrouter.ai/models or the provider's   ║
  # ║  model docs, then uncomment that single entry.           ║
