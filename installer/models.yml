# /Users/mayssam.sayyadian/ai-stack/installer/models.yml
# CANONICAL single source of truth for model<->agent binding.
# Inspect:  vz-ai-stack.sh model list
# Re-render every agent + the LiteLLM model_list (idempotent):  vz-ai-stack.sh model sync
# Re-point one agent:  vz-ai-stack.sh model assign <agent> <model>
version: 1
models:
  local-gemma4:
    runtime: ollama
    served: gemma4:e4b
    big: false
    note: "Default for any unassigned agent. ~9.6GB, stays on Ollama."
  local-qwen3.6:
    runtime: lmstudio
    served: qwen/qwen3.6-27b
    big: true
    ttl: 1800
    note: "~17.5GB MLX. Cannot coexist with local-qwen3-coder on 24GB."
  local-qwen3-coder:
    runtime: lmstudio
    served: qwen3-coder-30b-a3b-instruct-mlx
    big: true
    ttl: 1800
    note: "~17.2GB MLX. Cannot coexist with local-qwen3.6 on 24GB."
  # Claude SUBSCRIPTION via the Meridian host daemon (no API key). runtime:
  # meridian renders openai/<served> @ host.docker.internal:3456 + effort in
  # extra_body. One entry per effort level (output_config.effort; budget_tokens
  # is rejected on 4.7+). Availability-gates to `default` (local-gemma4) when
  # Meridian is down. NOT big (no local RAM). Sonnet has no xhigh (≡ high).
  claude-opus-4.8-sub-low: {runtime: meridian, served: claude-opus-4-8, effort: low, big: false, note: "Claude subscription (Opus 4.8), low effort."}
  claude-opus-4.8-sub-medium: {runtime: meridian, served: claude-opus-4-8, effort: medium, big: false, note: "Claude subscription (Opus 4.8), medium effort."}
  claude-opus-4.8-sub-high: {runtime: meridian, served: claude-opus-4-8, effort: high, big: false, note: "Claude subscription (Opus 4.8), high effort (model default)."}
  claude-opus-4.8-sub-xhigh: {runtime: meridian, served: claude-opus-4-8, effort: xhigh, big: false, note: "Claude subscription (Opus 4.8), xhigh effort."}
  claude-opus-4.8-sub-max: {runtime: meridian, served: claude-opus-4-8, effort: max, big: false, note: "Claude subscription (Opus 4.8), max effort."}
  claude-opus-4.8-sub-ultracode: {runtime: meridian, served: claude-opus-4-8, effort: ultracode, big: false, note: "Claude subscription (Opus 4.8), ultracode effort (coding-focused, highest tier)."}
  claude-sonnet-4.6-sub-low: {runtime: meridian, served: claude-sonnet-4-6, effort: low, big: false, note: "Claude subscription (Sonnet 4.6), low effort."}
  claude-sonnet-4.6-sub-medium: {runtime: meridian, served: claude-sonnet-4-6, effort: medium, big: false, note: "Claude subscription (Sonnet 4.6), medium effort."}
  claude-sonnet-4.6-sub-high: {runtime: meridian, served: claude-sonnet-4-6, effort: high, big: false, note: "Claude subscription (Sonnet 4.6), high effort."}
  claude-sonnet-4.6-sub-max: {runtime: meridian, served: claude-sonnet-4-6, effort: max, big: false, note: "Claude subscription (Sonnet 4.6), max effort."}
  claude-sonnet-4.6-sub-ultracode: {runtime: meridian, served: claude-sonnet-4-6, effort: ultracode, big: false, note: "Claude subscription (Sonnet 4.6), ultracode effort (coding-focused, highest tier)."}
# EMBEDDING models (separate plane from the chat `models:` above — different
# registry, validated + assigned via `vz-ai-stack.sh embedding`). `dim` is the
# vector size the model emits; `kind` is text|code (a code-tuned embedder degrades
# general prose and vice-versa). `via` is the call path: litellm (an embedding
# route in litellm/config.yaml — `route:` names it), ollama (direct pull), or
# ondevice (no network hop; CoreML on Apple Silicon). DIM is load-bearing: the
# docs collection (Qdrant `ai-stack-docs`) is pinned to its embedder's dim, so a
# dim change is a destructive re-ingest (see `embedding` GUARD + phase-06 ingest.py).
embeddings:
  embed-nomic:        { runtime: ollama, served: nomic-embed-text,                     dim: 768,  via: litellm,  route: embed-local,        kind: text }
  # jina-v2-base-code emits 768-dim per its HF model card; NOT pinned anywhere in
  # this repo, so `dim: 768` here is UNVERIFIED against local code (verify before
  # relying on it for a docs/openwebui assignment — Lumen keeps its own index).
  embed-jina-code:    { runtime: ollama, served: ordis/jina-embeddings-v2-base-code,   dim: 768,  via: ollama,                              kind: code, unverified: true }
  # On-device (MemPalace) embedders: `served` is the EXACT token MemPalace's
  # MEMPALACE_EMBEDDING_MODEL accepts (verified vs the installed mempalace pkg —
  # embedding.py resolves `embeddinggemma`, else minilm; config.py default minilm),
  # NOT the HF repo name. minilm's HF model is all-MiniLM-L6-v2 (provenance only).
  # Both yield 384-dim at runtime (embeddinggemma truncates via MRL).
  embed-minilm:       { runtime: onnx,   served: minilm,                                dim: 384,  via: ondevice, device: coreml,            kind: text }
  embed-gemma:        { runtime: onnx,   served: embeddinggemma,                        dim: 384,  via: ondevice, device: coreml,            kind: text, unverified: true }
  embed-openai-small: { runtime: openai, served: text-embedding-3-small,               dim: 1536, via: litellm,  route: embed-openai-small, kind: text }
  embed-openai-large: { runtime: openai, served: text-embedding-3-large,               dim: 3072, via: litellm,  route: embed-openai-large, kind: text }
# Per-service embedder assignments. Read at install time by each owning phase
# (06_documents / 16_lumen / 26_mempalace / bin/start-openwebui) with the phase's
# current hardcoded value as the fallback, so a missing section never breaks a
# phase. Re-point with `vz-ai-stack.sh embedding assign <service> <model>`.
embedding_assignments:
  docs:      embed-nomic
  openwebui: embed-nomic
  lumen:     embed-jina-code
  mempalace: embed-minilm
  honcho:    embed-openai-small
default: local-gemma4
# primary = the model an UNASSIGNED agent renders. Any runtime is allowed; it
# availability-gates to `default` (the always-on ollama fallback) when its
# runtime is down — so the local safety net is preserved. `default` stays ollama.
primary: claude-opus-4.8-sub-xhigh
assignments:
  # AI software-engineering team + agents. Platform policy (2026-06-20): EVERY
  # role uses claude-opus-4.8-sub-xhigh — the single platform default. local-gemma4
  # is the LiteLLM offline fallback only (Meridian unavailable), never assigned.
  hermes_manager: claude-opus-4.8-sub-xhigh
  hermes_techlead: claude-opus-4.8-sub-xhigh
  hermes_ml_engineer: claude-opus-4.8-sub-xhigh
  hermes_frontend_engineer: claude-opus-4.8-sub-xhigh
  hermes_backend_engineer: claude-opus-4.8-sub-xhigh
  hermes_qa_test_engineer: claude-opus-4.8-sub-xhigh
  hermes_reviewing_engineer: claude-opus-4.8-sub-xhigh
  hermes_sre_engineer: claude-opus-4.8-sub-xhigh
  hermes_incident_manager: claude-opus-4.8-sub-xhigh
  pi: claude-opus-4.8-sub-xhigh
  deerflow: claude-opus-4.8-sub-xhigh
  ace: claude-opus-4.8-sub-xhigh
  rlm: claude-opus-4.8-sub-xhigh
kinds:
  hermes_manager: {kind: hermes-profile, profile: hermes_manager, key_env: HERMES_LITELLM_KEY, desc: "engineering manager + product intake — specs acceptance criteria, decomposes, delegates, orchestrates the gate order; executes directly when fastest, else delegates"}
  hermes_techlead: {kind: hermes-profile, profile: hermes_techlead, key_env: HERMES_LITELLM_KEY, desc: "tech lead / architect — ADRs, interface contracts, design review, standards; co-designs ML work"}
  hermes_frontend_engineer: {kind: hermes-profile, profile: hermes_frontend_engineer, key_env: HERMES_LITELLM_KEY, desc: "frontend engineer — accessible, performant UI against the design contract"}
  hermes_backend_engineer: {kind: hermes-profile, profile: hermes_backend_engineer, key_env: HERMES_LITELLM_KEY, desc: "backend engineer — APIs, services, data and security basics against the contract"}
  hermes_ml_engineer: {kind: hermes-profile, profile: hermes_ml_engineer, key_env: HERMES_LITELLM_KEY, desc: "ML engineer — model selection, evals, data pipelines, finetuning, RAG; guards against overkill models"}
  hermes_qa_test_engineer: {kind: hermes-profile, profile: hermes_qa_test_engineer, key_env: HERMES_LITELLM_KEY, desc: "QA / test engineer — test strategy + automation; the green-bar quality gate"}
  hermes_reviewing_engineer: {kind: hermes-profile, profile: hermes_reviewing_engineer, key_env: HERMES_LITELLM_KEY, desc: "reviewing engineer (read-only) — adversarial review including the security pass"}
  hermes_sre_engineer: {kind: hermes-profile, profile: hermes_sre_engineer, key_env: HERMES_LITELLM_KEY, desc: "SRE — reliability, IaC, observability, CI/CD, safe deploys; prod-credentialed"}
  hermes_incident_manager: {kind: hermes-profile, profile: hermes_incident_manager, key_env: HERMES_LITELLM_KEY, desc: "incident manager (read-only) — incident command + blameless postmortems"}
  pi: {kind: pi, phase: 15, key_env: PI_LITELLM_KEY}
  deerflow: {kind: deerflow, phase: 10}
  ace: {kind: ace, phase: 17, key_env: ACE_LITELLM_KEY}
  rlm: {kind: rlm, phase: 18, key_env: RLM_LITELLM_KEY}
