    # override labels) and reach LiteLLM via host.docker.internal:4000 — they do NOT
    # join ai-stack, so no add_host: ['ollama:host-gateway'] here.
    network: none
    consumes_env: [AITOWN_LITELLM_KEY, AITOWN_ADMIN_KEY]
    help:
      "what": A watchable virtual town (a16z-infra/ai-town) — a Convex-backed docker-compose stack (backend + frontend + dashboard) where a cast of AI characters live, move around a map, and hold conversations in real time. You open it in a browser and watch the town tick.
      "why": Reach for it when you want to SEE a swarm of agents doing things in a persistent shared world (not just calling models independently) — the most demo-able of the agent-sim set. Every character action is an LLM call routed through LiteLLM, so it all shows up in Phoenix.
      "usage":
        - open http://aitown:5273                                  # watch the town (frontend)
        - open http://127.0.10.19:6791                             # Convex dashboard (admin; loopback)
        - bash ~/ai-stack/bin/start-aitown.sh                      # bring the stack up (first build is heavy)
        - bash ~/ai-stack/bin/start-aitown.sh status               # compose ps + caps + frontend health
        - "docker compose -p aitown ps"
        - "docker compose -p aitown logs -f backend"
