  honcho_mcp:
    enabled: true # Phase 40 (default-on under --include-optionals; decline with HONCHO_MEMORY_OPT_IN=0) — Honcho memory MCP shim (claude-cli + Hermes fleet)
    type: node-bg
    desc: "Honcho memory MCP shim — wraps Honcho's REST API as MCP tools (honcho_remember/recall/ask/search) for claude-cli (stdio) and the Hermes fleet (http)"
    phase: "40"
    upgrade:
      method: none              # in-repo shim — versions with the ai-stack repo itself
    # Host-loopback node daemon (bin/start-honcho_mcp.sh): the honcho-mcp HTTP server the
    # Hermes fleet dials at host.docker.internal:7082 (token-gated by HONCHO_MCP_TOKEN).
    # Local clients (host Claude Code, Pi) use the stdio entrypoint instead (honcho-mcp/
    # bin.mjs --stdio, registered via `claude mcp add`). NOT a container / NOT on the
    # ai-stack bridge → doctor check 16 (bridge membership) does not apply. Once Phase 40
    # retires the raw honcho:8000 sandbox egress, THIS shim is the only in-sandbox path
    # to Honcho.
    network: host
    bind: 127.0.0.1
    port: 7082
    health: http://127.0.0.1:7082/healthz
    consumes_env:
      - HONCHO_MCP_TOKEN
      - HONCHO_MCP_PORT
      - HONCHO_BASE_URL
      - HONCHO_WORKSPACE_ID
    help:
      "what": "A host-side, headless Node MCP shim (honcho-mcp/bin.mjs) that wraps Honcho's v3 REST API as four memory TOOLS — honcho_remember (write a turn), honcho_recall (a peer's derived representation), honcho_ask (natural-language dialectic query), honcho_search (semantic message search). Served two ways: stdio for local clients (host Claude Code, Pi) and a token-gated http daemon on 127.0.0.1:7082 (/healthz, /mcp) that the Hermes fleet dials via host.docker.internal:7082. FULL-SHARED workspace: every consumer shares one Honcho workspace + a default 'fleet' session, so anything one peer remembers is recallable by any peer (no per-agent isolation)."
      "why": "Reach for it to give agents durable, cross-session memory as MCP tools from ANY runtime — no per-client Honcho SDK glue. It is also the SECURITY choke point: Phase 40 retires the raw auth-off Honcho REST egress (:8000) from the sandboxes, so this token-gated shim becomes the ONLY in-sandbox path to Honcho. Complements the other memory surfaces — Honcho = derived cross-agent facts, MemPalace = verbatim session recall, docs-mcp = document RAG, Lumen = code search."
      "usage":
        - "mayssam-ai-stack.sh install honcho_mcp   # mints token, wires claude + fleet, retires :8000 (also runs by DEFAULT under `install all --include-optionals`)"
        - "HONCHO_MEMORY_OPT_IN=0 mayssam-ai-stack.sh install all --include-optionals   # DECLINE honcho memory (nothing stamped)"
        - "mayssam-ai-stack.sh start honcho_mcp   # the http daemon the fleet dials (:7082)"
        - "curl -s http://127.0.0.1:7082/healthz   # -> ok:true honcho:true base workspace"
        - "claude mcp list   # host Claude Code stdio registration (honcho)"
        - mayssam-ai-stack.sh stop honcho_mcp
      "config_notes": "DEFAULT-ON as of 2026-07-16 (operator decision): NOT in core `install all`, but it now installs by DEFAULT under `install all --include-optionals`, exactly like its sibling memory phases 39 (doc-RAG) and 41 (falkordb). It was previously gated behind HONCHO_MEMORY_OPT_IN=1 — a flag NOTHING in the repo ever set — so a blanket run silently DECLINED honcho while 39/41 wired themselves, invisibly (phase 40 exits 0 and check 75 skip-cleans when unstamped). DISCLOSE, don't withhold: enabling it CHANGES THE SECURITY POSTURE — it retires the raw auth-off honcho:8000 sandbox egress (a net TIGHTENING: the token-gated shim becomes the only in-sandbox path to Honcho) and establishes FULL-SHARED memory (every consumer shares ONE Honcho workspace + a default 'fleet' session — NO per-agent isolation, so anything one peer remembers is recallable by any peer; do not put per-agent secrets in it). The phase prints all three effects before acting. DECLINE with HONCHO_MEMORY_OPT_IN=0 mayssam-ai-stack.sh install all --include-optionals — the decline path stamps NOTHING (check 75 keys its skip-clean on phase_40*.done, so a stamped decline would red-bar a stack that opted out). Needs node on PATH (deps). HARD DEPENDENCY: the Phase-03 honcho embedding fix (EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL → LiteLLM) must be applied first, else honcho 401s on every search/recall/ingest (a wired-but-broken shim) — the phase aborts with the exact fix command if missing. The http daemon FAILS CLOSED: it refuses --http without HONCHO_MCP_TOKEN (bound 127.0.0.1 only, but the fleet reaches it via host.docker.internal, so an unauthenticated server would be a real exposure); stdio needs no token. The token is minted ONLY if absent (a re-mint would break already-wired consumers). Pi honcho is DEFERRED — Pi ships no MCP client, so it needs a dedicated pi extension; Pi's raw :8000 egress is retired regardless. Doctor check 75 (75_honcho_mcp.sh) covers it, including a security drift-guard that reds if the raw honcho_memory (:8000) egress reappears in a sandbox policy or the 04_openshell.sh generator. Rollback: claude mcp remove -s user honcho; mayssam-ai-stack.sh stop honcho_mcp; rm installer/state/phase_40.done."
