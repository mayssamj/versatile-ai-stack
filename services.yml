    # ai-stack-bridge membership NOR (intrinsically) the docker-run managed label —
    # they're a self-contained Convex stack that dials the HOST (host.docker.internal)
    # for LiteLLM. So check 53's container-liveness census sees them ONLY via the
    # compose-project signal — this `project:` is load-bearing (also added to check 53's
    # _53_STACK_PROJECTS_FALLBACK floor). The override pins `name: aitown`.
    project: aitown
    port: 5273
    bind: 127.0.0.1
    phase: "36"
    open_url: http://aitown:5273
    alias: aitown
    host_ip: 127.0.10.19
    host_port: 5273
    container_port: 5173
