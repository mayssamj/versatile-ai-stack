      # Multi-package requirements oracle+handler (uv-reqs): SCOPED to the req
      # names (--upgrade-package each — a bare -U would drag the whole closure,
      # torch included, through a routine sweep); the oracle is the SAME resolve
      # with --dry-run, so it converges with the handler by construction; the
